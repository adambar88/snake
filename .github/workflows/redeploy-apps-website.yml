name: Redeploy apps-website

on:
  push:
    branches: [main]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            --fail
